name: Release
# Push a tag such as v0.3.0 to build Craftinator-v0.3.0.zip and attach it to a GitHub release.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the .toc version
        run: |
          version=$(grep -oP '^## Version: \K.*' Craftinator.toc | tr -d '\r')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match .toc version $version"; exit 1; }
      - name: Build the zip
        # The addon is the .toc, the Lua files beside it, and the Data and UI folders.
        run: |
          mkdir -p build/Craftinator
          cp -r Craftinator.toc *.lua Data UI build/Craftinator/
          cp LICENSE build/Craftinator/LICENSE.txt
          cd build && zip -r "../Craftinator-$GITHUB_REF_NAME.zip" Craftinator
      - name: Take this version's notes from CHANGELOG.md
        # The lines under "## <version>" up to the next "## " heading.
        run: |
          awk -v v="## ${GITHUB_REF_NAME#v}" '$0 == v {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"; exit 1; }
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "Craftinator-$GITHUB_REF_NAME.zip" --title "Craftinator $GITHUB_REF_NAME" --notes-file notes.md
